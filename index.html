<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUSINESS EMPIRE: ПОЛНЫЙ ЭКРАН</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        body {
            background: linear-gradient(135deg, #0a0e17, #0d1220);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }

        .game-container {
            width: 100%;
            height: 100vh;
            height: 100dvh; /* Для современных браузеров */
            background: #0e121f;
            display: flex;
            flex-direction: column;
            border: 2px solid #ffd966;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            position: relative;
            border-radius: 0; /* Убираем скругления для полного экрана */
        }

        .top-panel {
            background: #141a26;
            border-bottom: 2px solid #ffd966;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .player-avatar {
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #2a3f5a, #1a2a3a);
            border-radius: 50%;
            border: 2px solid #ffd966;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #ffd966;
            flex-shrink: 0;
        }

        .stats-row {
            display: flex;
            gap: 12px;
        }

        .stat-block {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            color: #8a9ab0;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            color: white;
            font-size: 16px;
            font-weight: 700;
        }

        .stat-value.gold {
            color: #ffd966;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            background: #1e2c3a;
            border: 2px solid #ffd966;
            color: #e0e8f0;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            touch-action: manipulation;
        }

        .header-btn:active {
            background: #2a3e52;
            transform: scale(0.95);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            min-height: 0; /* Важно для flex-контейнера */
        }

        .left-menu {
            width: 80px;
            background: #0c111c;
            border-right: 2px solid #ffd966;
            padding: 12px 0;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .menu-item {
            padding: 12px 5px;
            color: #a0b0c0;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            border-left: 3px solid transparent;
            cursor: pointer;
            text-align: center;
            word-break: break-word;
        }

        .menu-item i {
            font-size: 24px;
        }

        .menu-item:active {
            background: #1a2330;
            color: white;
        }

        .menu-item.active {
            background: #1e2c3a;
            color: #ffd966;
            border-left-color: #ffd966;
        }

        .content-panel {
            flex: 1;
            background: #101624;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }

        .resources-bar {
            background: #141a26;
            border-bottom: 2px solid #ffd966;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            flex-shrink: 0;
        }

        .resource-card {
            background: #1e2a38;
            border-radius: 8px;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #ffd966;
            min-width: 0;
        }

        .resource-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        .resource-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
        }

        .resource-name {
            color: #8a9ab0;
            font-size: 9px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .resource-count {
            color: white;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .resource-count.gold {
            color: #ffd966;
        }

        .section-header {
            padding: 10px 12px;
            border-bottom: 2px solid #ffd966;
            flex-shrink: 0;
        }

        .section-title {
            color: white;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cards-grid {
            padding: 12px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            overflow-y: auto;
            height: 100%;
            min-height: 0;
        }

        .cards-grid {
            display: none;
        }

        .cards-grid.active {
            display: grid;
        }

        .business-card {
            background: #1a2330;
            border: 2px solid #ffd966;
            border-radius: 12px;
            padding: 14px;
            transition: 0.2s;
        }

        .business-card:active {
            transform: scale(0.99);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .card-icon {
            font-size: 36px;
            flex-shrink: 0;
        }

        .card-title {
            color: white;
            font-size: 18px;
            font-weight: 700;
        }

        .card-level {
            color: #ffd966;
            font-size: 13px;
        }

        .profit-block {
            background: #101624;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            text-align: center;
        }

        .profit-label {
            color: #8a9ab0;
            font-size: 11px;
        }

        .profit-value {
            color: #4caf50;
            font-size: 22px;
            font-weight: 800;
        }

        .card-stats {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            color: #a0b0c0;
            font-size: 13px;
        }

        .card-price {
            color: #ffd966;
            font-size: 18px;
            font-weight: 700;
        }

        .progress-bar {
            background: #101624;
            height: 6px;
            border-radius: 3px;
            margin: 10px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            width: 0%;
        }

        .button-group {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .buy-button {
            background: #2a4a7a;
            border: none;
            color: white;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            flex: 1;
            border: 2px solid #ffd966;
            touch-action: manipulation;
        }

        .buy-button:active {
            background: #3a5a8a;
            transform: scale(0.95);
        }

        .buy-button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .manager-button {
            background: #7a4a2a;
        }

        .price-change {
            font-size: 12px;
            margin-top: 4px;
        }

        .price-up {
            color: #4caf50;
        }

        .price-down {
            color: #f44336;
        }

        .game-area {
            grid-column: 1/-1;
            background: #1a2330;
            border: 3px solid #ffd966;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }

        .game-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffd966, #cc9c33);
            border: 6px solid white;
            font-size: 40px;
            color: white;
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 10px 0 #8b5e3c;
            touch-action: manipulation;
        }

        .game-button:active {
            transform: translateY(5px);
            box-shadow: 0 5px 0 #8b5e3c;
        }

        .right-panel {
            display: none;
        }

        .notification {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background: #1e2c3a;
            border: 2px solid #ffd966;
            color: white;
            padding: 15px 20px;
            border-radius: 30px;
            font-size: 15px;
            transform: translateY(-150%);
            transition: transform 0.3s;
            z-index: 1000;
            text-align: center;
            max-width: 350px;
            margin: 0 auto;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .notification.show {
            transform: translateY(0);
        }

        /* Для очень маленьких экранов */
        @media (max-width: 350px) {
            .stat-value {
                font-size: 14px;
            }
            
            .menu-item {
                font-size: 11px;
                padding: 8px 3px;
            }
            
            .menu-item i {
                font-size: 20px;
            }
            
            .left-menu {
                width: 70px;
            }
            
            .game-button {
                width: 100px;
                height: 100px;
                font-size: 32px;
            }
            
            .card-icon {
                font-size: 32px;
            }
            
            .card-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container" id="gameContainer">
        <div class="top-panel" id="topPanel">
            <div class="player-info">
                <div class="player-avatar">👑</div>
                <div class="stats-row">
                    <div class="stat-block">
                        <span class="stat-label">УР</span>
                        <span class="stat-value" id="levelValue">1</span>
                    </div>
                    <div class="stat-block">
                        <span class="stat-label">БАЛ</span>
                        <span class="stat-value gold" id="balance">$1k</span>
                    </div>
                </div>
            </div>
            <div class="header-buttons">
                <div class="header-btn" onclick="toggleTheme()">🎨</div>
            </div>
        </div>

        <div class="main-container">
            <div class="left-menu" id="leftMenu">
                <div class="menu-item active" data-section="businesses"><i>🏢</i> Биз</div>
                <div class="menu-item" data-section="stocks"><i>📈</i> Акц</div>
                <div class="menu-item" data-section="realestate"><i>🏘️</i> Нед</div>
                <div class="menu-item" data-section="managers"><i>👥</i> Мен</div>
                <div class="menu-item" data-section="minigames"><i>🎮</i> Игр</div>
                <div class="menu-item" data-section="quests"><i>⚔️</i> Зад</div>
            </div>

            <div class="content-panel" id="contentPanel">
                <div class="resources-bar" id="resourcesBar">
                    <div class="resource-card">
                        <div class="resource-icon">💰</div>
                        <div class="resource-info">
                            <span class="resource-name">БАЛ</span>
                            <span class="resource-count gold" id="balanceDisplay">$1k</span>
                        </div>
                    </div>
                    <div class="resource-card">
                        <div class="resource-icon">💎</div>
                        <div class="resource-info">
                            <span class="resource-name">КРИС</span>
                            <span class="resource-count" id="crystals">0</span>
                        </div>
                    </div>
                    <div class="resource-card">
                        <div class="resource-icon">⚡</div>
                        <div class="resource-info">
                            <span class="resource-name">ЭН</span>
                            <span class="resource-count" id="energy">100</span>
                        </div>
                    </div>
                    <div class="resource-card">
                        <div class="resource-icon">👥</div>
                        <div class="resource-info">
                            <span class="resource-name">МЕН</span>
                            <span class="resource-count" id="managersCount">0</span>
                        </div>
                    </div>
                    <div class="resource-card">
                        <div class="resource-icon">📊</div>
                        <div class="resource-info">
                            <span class="resource-name">ДОХ</span>
                            <span class="resource-count" id="incomePerSec">$0</span>
                        </div>
                    </div>
                    <div class="resource-card">
                        <div class="resource-icon">⭐</div>
                        <div class="resource-info">
                            <span class="resource-name">УР</span>
                            <span class="resource-count" id="level">1</span>
                        </div>
                    </div>
                </div>

                <div class="section-header">
                    <div class="section-title" id="sectionTitle">
                        <span>🏢</span> БИЗНЕСЫ
                    </div>
                </div>

                <div id="businesses-grid" class="cards-grid active"></div>
                <div id="stocks-grid" class="cards-grid"></div>
                <div id="realestate-grid" class="cards-grid"></div>
                <div id="managers-grid" class="cards-grid"></div>
                <div id="minigames-grid" class="cards-grid"></div>
                <div id="quests-grid" class="cards-grid"></div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // Глобальные переменные
        let balance = 1000;
        let crystals = 0;
        let energy = 100;
        let maxEnergy = 100;
        let level = 1;
        let exp = 0;
        let expToNextLevel = 1000;
        let incomePerSecond = 0;
        let currentSection = 'businesses';
        let currentTheme = 'dark';

        // БИЗНЕСЫ
        let businesses = [
            { id: 0, name: 'Ларёк', icon: '🏪', baseIncome: 10, level: 0, cost: 500, manager: false },
            { id: 1, name: 'Фастфуд', icon: '🍔', baseIncome: 50, level: 0, cost: 2500, manager: false },
            { id: 2, name: 'Супермаркет', icon: '🏬', baseIncome: 250, level: 0, cost: 12500, manager: false },
            { id: 3, name: 'Банк', icon: '🏦', baseIncome: 1250, level: 0, cost: 62500, manager: false },
            { id: 4, name: 'Завод', icon: '🏭', baseIncome: 6250, level: 0, cost: 312500, manager: false },
            { id: 5, name: 'Отель', icon: '🏨', baseIncome: 31250, level: 0, cost: 1562500, manager: false },
            { id: 6, name: 'Авиакомпания', icon: '✈️', baseIncome: 156250, level: 0, cost: 7812500, manager: false },
            { id: 7, name: 'Космотуризм', icon: '🚀', baseIncome: 781250, level: 0, cost: 39062500, manager: false },
            { id: 8, name: 'Мегакорпорация', icon: '🌍', baseIncome: 3906250, level: 0, cost: 195312500, manager: false },
            { id: 9, name: 'Галактическая', icon: '👑', baseIncome: 19531250, level: 0, cost: 976562500, manager: false }
        ];

        // АКЦИИ
        let stocks = [
            { id: 0, name: 'Apple', icon: '🍎', price: 180, oldPrice: 180, shares: 0, dividend: 0.05 },
            { id: 1, name: 'Microsoft', icon: '💻', price: 380, oldPrice: 380, shares: 0, dividend: 0.05 },
            { id: 2, name: 'Google', icon: '🔍', price: 140, oldPrice: 140, shares: 0, dividend: 0.05 },
            { id: 3, name: 'Amazon', icon: '📦', price: 130, oldPrice: 130, shares: 0, dividend: 0.05 },
            { id: 4, name: 'Tesla', icon: '🚗', price: 250, oldPrice: 250, shares: 0, dividend: 0.05 },
            { id: 5, name: 'NVIDIA', icon: '🎮', price: 800, oldPrice: 800, shares: 0, dividend: 0.05 },
            { id: 6, name: 'Netflix', icon: '📺', price: 450, oldPrice: 450, shares: 0, dividend: 0.05 },
            { id: 7, name: 'Disney', icon: '🐭', price: 110, oldPrice: 110, shares: 0, dividend: 0.05 },
            { id: 8, name: 'Coca-Cola', icon: '🥤', price: 60, oldPrice: 60, shares: 0, dividend: 0.05 },
            { id: 9, name: 'McDonalds', icon: '🍔', price: 280, oldPrice: 280, shares: 0, dividend: 0.05 }
        ];

        // НЕДВИЖИМОСТЬ
        let properties = [
            { id: 0, name: 'Гараж', icon: '🏠', income: 5, level: 0, cost: 2000, maxLevel: 10 },
            { id: 1, name: 'Квартира', icon: '🏘️', income: 25, level: 0, cost: 10000, maxLevel: 10 },
            { id: 2, name: 'Дом', icon: '🏡', income: 125, level: 0, cost: 50000, maxLevel: 10 },
            { id: 3, name: 'Офис', icon: '🏬', income: 625, level: 0, cost: 250000, maxLevel: 10 },
            { id: 4, name: 'Отель', icon: '🏨', income: 3125, level: 0, cost: 1250000, maxLevel: 10 },
            { id: 5, name: 'Завод', icon: '🏭', income: 15625, level: 0, cost: 6250000, maxLevel: 10 },
            { id: 6, name: 'ТЦ', icon: '🏛️', income: 78125, level: 0, cost: 31250000, maxLevel: 10 },
            { id: 7, name: 'Замок', icon: '🏰', income: 390625, level: 0, cost: 156250000, maxLevel: 10 },
            { id: 8, name: 'Остров', icon: '🏝️', income: 1953125, level: 0, cost: 781250000, maxLevel: 10 },
            { id: 9, name: 'Космодром', icon: '🌌', income: 9765625, level: 0, cost: 3906250000, maxLevel: 10 }
        ];

        // МЕНЕДЖЕРЫ
        let managers = [
            { id: 0, name: 'Ларёк', businessId: 0, cost: 10, hired: false },
            { id: 1, name: 'Фастфуд', businessId: 1, cost: 20, hired: false },
            { id: 2, name: 'Супермаркет', businessId: 2, cost: 30, hired: false },
            { id: 3, name: 'Банк', businessId: 3, cost: 40, hired: false },
            { id: 4, name: 'Завод', businessId: 4, cost: 50, hired: false },
            { id: 5, name: 'Отель', businessId: 5, cost: 60, hired: false },
            { id: 6, name: 'Авиакомпания', businessId: 6, cost: 70, hired: false },
            { id: 7, name: 'Космотуризм', businessId: 7, cost: 80, hired: false },
            { id: 8, name: 'Мегакорпорация', businessId: 8, cost: 90, hired: false },
            { id: 9, name: 'Галактическая', businessId: 9, cost: 100, hired: false }
        ];

        // ЗАДАНИЯ
        let quests = [
            { id: 0, name: 'Заработать $10k', requirement: 10000, progress: 0, reward: 1000, completed: false },
            { id: 1, name: 'Купить 5 бизнесов', requirement: 5, progress: 0, reward: 5000, completed: false },
            { id: 2, name: 'Купить 10 акций', requirement: 10, progress: 0, reward: 2000, completed: false },
            { id: 3, name: 'Улучшить недвиж 5р', requirement: 5, progress: 0, reward: 3000, completed: false },
            { id: 4, name: 'Нанять 3 менеджеров', requirement: 3, progress: 0, reward: 15, rewardType: 'crystals', completed: false }
        ];

        function toggleTheme() {
            if (currentTheme === 'dark') {
                document.body.style.background = 'linear-gradient(135deg, #f0f0f0, #ffffff)';
                document.getElementById('gameContainer').style.background = '#ffffff';
                document.getElementById('gameContainer').style.borderColor = '#4a6a9a';
                document.getElementById('topPanel').style.background = '#e0e0e0';
                document.getElementById('topPanel').style.borderColor = '#4a6a9a';
                document.getElementById('leftMenu').style.background = '#d0d0d0';
                document.getElementById('leftMenu').style.borderColor = '#4a6a9a';
                document.getElementById('contentPanel').style.background = '#f5f5f5';
                document.getElementById('resourcesBar').style.background = '#e0e0e0';
                document.getElementById('resourcesBar').style.borderColor = '#4a6a9a';
                currentTheme = 'light';
            } else {
                document.body.style.background = 'linear-gradient(135deg, #0a0e17, #0d1220)';
                document.getElementById('gameContainer').style.background = '#0e121f';
                document.getElementById('gameContainer').style.borderColor = '#ffd966';
                document.getElementById('topPanel').style.background = '#141a26';
                document.getElementById('topPanel').style.borderColor = '#ffd966';
                document.getElementById('leftMenu').style.background = '#0c111c';
                document.getElementById('leftMenu').style.borderColor = '#ffd966';
                document.getElementById('contentPanel').style.background = '#101624';
                document.getElementById('resourcesBar').style.background = '#141a26';
                document.getElementById('resourcesBar').style.borderColor = '#ffd966';
                currentTheme = 'dark';
            }
            showNotification('🎨 Тема изменена');
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 2000);
        }

        function formatNumber(num) {
            if (num === undefined || num === null || isNaN(num)) return '0';
            if (num >= 1e12) return (num / 1e12).toFixed(1) + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
            return num.toFixed(0);
        }

        function updateUI() {
            document.getElementById('balanceDisplay').textContent = '$' + formatNumber(balance);
            document.getElementById('balance').textContent = '$' + formatNumber(balance);
            document.getElementById('crystals').textContent = formatNumber(crystals);
            document.getElementById('energy').textContent = Math.floor(energy);
            document.getElementById('incomePerSec').textContent = '$' + formatNumber(incomePerSecond);
            document.getElementById('level').textContent = level;
            document.getElementById('levelValue').textContent = level;
            
            const hiredCount = managers.filter(m => m.hired).length;
            document.getElementById('managersCount').textContent = hiredCount;
        }

        function updateIncome() {
            let income = 0;
            
            businesses.forEach(business => {
                if (business.level > 0) {
                    income += business.baseIncome * business.level;
                }
            });
            
            properties.forEach(property => {
                if (property.level > 0) {
                    income += property.income * property.level;
                }
            });
            
            stocks.forEach(stock => {
                if (stock.shares > 0) {
                    income += stock.shares * stock.price * stock.dividend;
                }
            });
            
            incomePerSecond = income;
            balance += income;
            
            exp += income;
            if (exp >= expToNextLevel) {
                level++;
                exp -= expToNextLevel;
                expToNextLevel = Math.floor(expToNextLevel * 1.5);
                maxEnergy += 10;
                showNotification(`⭐ Уровень ${level}!`);
            }
            
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 0.5);
            }
            
            updateUI();
        }

        function buyBusiness(id) {
            const business = businesses[id];
            if (!business) return;
            
            const cost = business.cost * (business.level + 1);
            
            if (balance >= cost) {
                balance -= cost;
                business.level++;
                quests[1].progress = businesses.filter(b => b.level > 0).length;
                showNotification(`✅ ${business.name} +1`);
                updateUI();
                renderBusinesses();
            } else {
                showNotification('❌ Мало денег');
            }
        }

        function renderBusinesses() {
            const grid = document.getElementById('businesses-grid');
            grid.innerHTML = '';
            
            businesses.forEach(business => {
                const profit = business.baseIncome * (business.level || 1);
                const cost = business.cost * (business.level + 1);
                
                const card = document.createElement('div');
                card.className = 'business-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-icon">${business.icon}</div>
                        <div>
                            <div class="card-title">${business.name}</div>
                            <div class="card-level">${business.level} ур</div>
                        </div>
                    </div>
                    <div class="profit-block">
                        <div class="profit-label">ДОХОД/СЕК</div>
                        <div class="profit-value">$${formatNumber(profit)}</div>
                    </div>
                    <div class="card-stats">
                        <span>Цена:</span>
                        <span class="card-price">$${formatNumber(cost)}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${business.level * 10}%"></div>
                    </div>
                    <button class="buy-button" onclick="buyBusiness(${business.id})" 
                        ${balance < cost ? 'disabled' : ''}>
                        ${business.level === 0 ? 'КУПИТЬ' : '+1 УР'}
                    </button>
                `;
                
                grid.appendChild(card);
            });
        }

        function buyStock(id, amount) {
            const stock = stocks[id];
            if (!stock) return;
            
            const cost = stock.price * amount;
            
            if (balance >= cost && amount > 0) {
                balance -= cost;
                stock.shares += amount;
                const totalShares = stocks.reduce((sum, s) => sum + s.shares, 0);
                quests[2].progress = totalShares;
                showNotification(`✅ +${amount} ${stock.name}`);
                updateUI();
                renderStocks();
            }
        }

        function sellStock(id, amount) {
            const stock = stocks[id];
            if (!stock) return;
            
            if (stock.shares >= amount && amount > 0) {
                balance += stock.price * amount;
                stock.shares -= amount;
                showNotification(`💰 -${amount} ${stock.name}`);
                updateUI();
                renderStocks();
            }
        }

        function renderStocks() {
            const grid = document.getElementById('stocks-grid');
            grid.innerHTML = '';
            
            stocks.forEach(stock => {
                const change = ((stock.price - stock.oldPrice) / (stock.oldPrice || 1) * 100).toFixed(1);
                const changeClass = change >= 0 ? 'price-up' : 'price-down';
                const changeSign = change >= 0 ? '+' : '';
                
                const maxBuy = Math.floor(balance / stock.price);
                const dividendIncome = stock.shares * stock.price * stock.dividend;
                
                const card = document.createElement('div');
                card.className = 'business-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-icon">${stock.icon}</div>
                        <div>
                            <div class="card-title">${stock.name}</div>
                            <div class="card-level">${stock.shares} шт</div>
                        </div>
                    </div>
                    <div class="profit-block">
                        <div class="profit-label">ЦЕНА</div>
                        <div class="profit-value">$${formatNumber(stock.price)}</div>
                        <div class="price-change ${changeClass}">${changeSign}${change}%</div>
                    </div>
                    <div class="card-stats">
                        <span>Дивиденды/сек:</span>
                        <span class="card-price">$${formatNumber(dividendIncome)}</span>
                    </div>
                    <div class="button-group">
                        <button class="buy-button" onclick="buyStock(${stock.id}, 1)">1</button>
                        <button class="buy-button" onclick="buyStock(${stock.id}, 10)" ${balance < stock.price * 10 ? 'disabled' : ''}>10</button>
                        <button class="buy-button max-button" onclick="buyStock(${stock.id}, ${maxBuy})" ${balance < stock.price ? 'disabled' : ''}>MAX</button>
                    </div>
                    ${stock.shares > 0 ? `
                        <div class="button-group" style="margin-top: 5px;">
                            <button class="buy-button" style="background: #7a4a2a;" onclick="sellStock(${stock.id}, 1)">-1</button>
                            <button class="buy-button" style="background: #7a4a2a;" onclick="sellStock(${stock.id}, 10)">-10</button>
                            <button class="buy-button max-button" style="background: #7a4a2a;" onclick="sellStock(${stock.id}, ${stock.shares})">ВСЁ</button>
                        </div>
                    ` : ''}
                `;
                
                grid.appendChild(card);
            });
        }

        function buyProperty(id) {
            const property = properties[id];
            if (!property) return;
            
            const cost = property.cost * (property.level + 1);
            
            if (balance >= cost && property.level < property.maxLevel) {
                balance -= cost;
                property.level++;
                const totalUpgrades = properties.reduce((sum, p) => sum + p.level, 0);
                quests[3].progress = totalUpgrades;
                showNotification(`✅ ${property.name} +1`);
                updateUI();
                renderRealEstate();
            }
        }

        function renderRealEstate() {
            const grid = document.getElementById('realestate-grid');
            grid.innerHTML = '';
            
            properties.forEach(property => {
                const profit = property.income * (property.level || 1);
                const cost = property.cost * (property.level + 1);
                
                const card = document.createElement('div');
                card.className = 'business-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-icon">${property.icon}</div>
                        <div>
                            <div class="card-title">${property.name}</div>
                            <div class="card-level">${property.level}/${property.maxLevel}</div>
                        </div>
                    </div>
                    <div class="profit-block">
                        <div class="profit-label">ДОХОД/СЕК</div>
                        <div class="profit-value">$${formatNumber(profit)}</div>
                    </div>
                    <div class="card-stats">
                        <span>Цена:</span>
                        <span class="card-price">$${formatNumber(cost)}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${(property.level / property.maxLevel) * 100}%"></div>
                    </div>
                    ${property.level < property.maxLevel ? `
                        <button class="buy-button" onclick="buyProperty(${property.id})" 
                            ${balance < cost ? 'disabled' : ''}>
                            +1 УР
                        </button>
                    ` : `
                        <button class="buy-button" disabled>MAX</button>
                    `}
                `;
                
                grid.appendChild(card);
            });
        }

        function hireManager(id) {
            const manager = managers[id];
            if (!manager) return;
            
            if (crystals >= manager.cost && !manager.hired) {
                crystals -= manager.cost;
                manager.hired = true;
                const hiredCount = managers.filter(m => m.hired).length;
                quests[4].progress = hiredCount;
                showNotification(`👥 ${manager.name}`);
                updateUI();
                renderManagers();
            } else if (manager.hired) {
                showNotification('❌ Уже нанят');
            } else {
                showNotification('❌ Мало кристаллов');
            }
        }

        function renderManagers() {
            const grid = document.getElementById('managers-grid');
            grid.innerHTML = '';
            
            managers.forEach(manager => {
                const business = businesses[manager.businessId];
                
                const card = document.createElement('div');
                card.className = 'business-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-icon">👥</div>
                        <div>
                            <div class="card-title">${business.name}</div>
                            <div class="card-level">${manager.hired ? '✅' : '💎' + manager.cost}</div>
                        </div>
                    </div>
                    <div class="profit-block">
                        <div class="profit-label">ЭФФЕКТ</div>
                        <div class="profit-value">Автосбор</div>
                    </div>
                    ${!manager.hired ? `
                        <button class="buy-button manager-button" onclick="hireManager(${manager.id})" 
                            ${crystals < manager.cost ? 'disabled' : ''}>
                            НАНЯТЬ
                        </button>
                    ` : `
                        <button class="buy-button" disabled>НАНЯТ</button>
                    `}
                `;
                
                grid.appendChild(card);
            });
        }

        function playGuessGame() {
            if (energy < 10) {
                showNotification('❌ Мало энергии');
                return;
            }
            
            energy -= 10;
            const number = Math.floor(Math.random() * 10) + 1;
            const guess = Math.floor(Math.random() * 10) + 1;
            
            if (guess === number) {
                const reward = Math.floor(Math.random() * 3) + 1;
                crystals += reward;
                showNotification(`🎉 +${reward}💎`);
            } else {
                showNotification(`😢 Было ${number}`);
            }
            
            updateUI();
        }

        function playCoinGame(choice) {
            if (energy < 5) {
                showNotification('❌ Мало энергии');
                return;
            }
            
            energy -= 5;
            const coin = Math.random() < 0.5 ? 'орел' : 'решка';
            
            if (choice === coin) {
                crystals += 2;
                showNotification(`🎉 +2💎`);
            } else {
                showNotification(`😢 Выпал ${coin}`);
            }
            
            updateUI();
        }

        let clickCount = 0;
        let clickTime = 0;
        let clickInterval = null;
        let clickGameActive = false;

        function startClickGame() {
            if (energy < 20) {
                showNotification('❌ Мало энергии');
                return;
            }
            
            energy -= 20;
            clickCount = 0;
            clickTime = 10;
            clickGameActive = true;
            
            if (clickInterval) clearInterval(clickInterval);
            
            clickInterval = setInterval(() => {
                clickTime--;
                if (clickTime <= 0) {
                    clearInterval(clickInterval);
                    clickGameActive = false;
                    const reward = Math.floor(clickCount / 2);
                    crystals += reward;
                    showNotification(`🎉 +${reward}💎 (${clickCount} кликов)`);
                    updateUI();
                }
            }, 1000);
        }

        function click() {
            if (clickGameActive) {
                clickCount++;
            }
        }

        function renderMinigames() {
            const grid = document.getElementById('minigames-grid');
            grid.innerHTML = `
                <div class="game-area">
                    <div style="font-size: 36px;">🎰</div>
                    <div style="font-size: 22px; color: #ffd966;">УГАДАЙ</div>
                    <button class="game-button" onclick="playGuessGame()">🎲</button>
                    <div>⚡10 | 💎1-3</div>
                </div>
                
                <div class="game-area">
                    <div style="font-size: 36px;">🪙</div>
                    <div style="font-size: 22px; color: #ffd966;">ОРЛЯНКА</div>
                    <div>
                        <button class="game-button" onclick="playCoinGame('орел')">🦅</button>
                        <button class="game-button" onclick="playCoinGame('решка')">🪙</button>
                    </div>
                    <div>⚡5 | 💎2</div>
                </div>
                
                <div class="game-area">
                    <div style="font-size: 36px;">⚡</div>
                    <div style="font-size: 22px; color: #ffd966;">КЛИКЕР</div>
                    <button class="game-button" onclick="startClickGame()">🖱️</button>
                    <div>⚡20 | 💎клики/2</div>
                </div>
            `;
        }

        function claimQuest(id) {
            const quest = quests[id];
            if (!quest) return;
            
            if (quest.progress >= quest.requirement && !quest.completed) {
                if (quest.rewardType === 'crystals') {
                    crystals += quest.reward;
                } else {
                    balance += quest.reward;
                }
                quest.completed = true;
                showNotification(`🎉 +${quest.reward} ${quest.rewardType === 'crystals' ? '💎' : '$'}`);
                updateUI();
                renderQuests();
            }
        }

        function renderQuests() {
            const grid = document.getElementById('quests-grid');
            grid.innerHTML = '';
            
            quests.forEach(quest => {
                if (quest.completed) return;
                
                const progress = (quest.progress / quest.requirement) * 100;
                
                const card = document.createElement('div');
                card.className = 'business-card';
                card.innerHTML = `
                    <div class="card-title">⚔️ ${quest.name}</div>
                    <div class="profit-block">
                        <div class="profit-value">${formatNumber(quest.progress)}/${formatNumber(quest.requirement)}</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${Math.min(progress, 100)}%"></div>
                    </div>
                    <div class="card-stats">
                        <span>Награда:</span>
                        <span class="card-price">${quest.rewardType === 'crystals' ? '💎' : '$'}${formatNumber(quest.reward)}</span>
                    </div>
                    ${quest.progress >= quest.requirement ? `
                        <button class="buy-button" onclick="claimQuest(${quest.id})">
                            ПОЛУЧИТЬ
                        </button>
                    ` : ''}
                `;
                
                grid.appendChild(card);
            });
        }

        function updateStockPrices() {
            stocks.forEach(stock => {
                stock.oldPrice = stock.price;
                const change = (Math.random() * 0.2 - 0.1);
                stock.price = stock.price * (1 + change);
                if (stock.price < 1) stock.price = 1;
            });
            if (currentSection === 'stocks') renderStocks();
        }

        function init() {
            document.querySelectorAll('.menu-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
                    document.querySelectorAll('.cards-grid').forEach(g => g.classList.remove('active'));
                    
                    this.classList.add('active');
                    currentSection = this.dataset.section;
                    
                    const grid = document.getElementById(`${currentSection}-grid`);
                    if (grid) grid.classList.add('active');
                    
                    const titles = {
                        businesses: 'БИЗНЕСЫ',
                        stocks: 'АКЦИИ',
                        realestate: 'НЕДВИЖИМОСТЬ',
                        managers: 'МЕНЕДЖЕРЫ',
                        minigames: 'МИНИ ИГРЫ',
                        quests: 'ЗАДАНИЯ'
                    };
                    
                    document.getElementById('sectionTitle').innerHTML = `<span>${this.querySelector('i').textContent}</span> ${titles[currentSection]}`;
                    
                    if (currentSection === 'businesses') renderBusinesses();
                    else if (currentSection === 'stocks') renderStocks();
                    else if (currentSection === 'realestate') renderRealEstate();
                    else if (currentSection === 'managers') renderManagers();
                    else if (currentSection === 'minigames') renderMinigames();
                    else if (currentSection === 'quests') renderQuests();
                });
            });

            renderBusinesses();
            renderStocks();
            renderRealEstate();
            renderManagers();
            renderMinigames();
            renderQuests();
            updateUI();

            setInterval(updateIncome, 1000);
            setInterval(updateStockPrices, 60000);
        }

        window.toggleTheme = toggleTheme;
        window.buyBusiness = buyBusiness;
        window.buyStock = buyStock;
        window.sellStock = sellStock;
        window.buyProperty = buyProperty;
        window.hireManager = hireManager;
        window.playGuessGame = playGuessGame;
        window.playCoinGame = playCoinGame;
        window.startClickGame = startClickGame;
        window.click = click;
        window.claimQuest = claimQuest;

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
