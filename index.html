<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUSINESS EMPIRE: АВТОСОХРАНЕНИЕ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: linear-gradient(145deg, #0a0f1e, #0d1428);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .game-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            background: rgba(18, 25, 40, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            display: flex;
            flex-direction: column;
            border: 2px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 50px rgba(255, 215, 0, 0.2);
            overflow: hidden;
            position: relative;
        }

        .top-panel {
            background: rgba(10, 15, 26, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 215, 0, 0.3);
            padding: 20px 20px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-avatar {
            width: 55px;
            height: 55px;
            background: linear-gradient(145deg, #ffd966, #ffaa33);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #0a0f1e;
            box-shadow: 0 10px 20px rgba(255, 215, 0, 0.3);
            transform: rotate(5deg);
        }

        .stats-grid {
            display: flex;
            gap: 20px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            color: white;
            font-size: 22px;
            font-weight: 800;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .stat-value.gold {
            color: #ffd966;
            text-shadow: 0 0 15px #ffaa00;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.3);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 18px;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(5px);
        }

        .header-btn:active {
            background: rgba(255, 215, 0, 0.2);
            transform: scale(0.9);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 15px;
            gap: 15px;
        }

        .left-menu {
            width: 85px;
            background: rgba(10, 15, 26, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 35px;
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border: 2px solid rgba(255, 215, 0, 0.2);
        }

        .menu-item {
            width: 60px;
            height: 60px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }

        .menu-item i {
            font-size: 26px;
        }

        .menu-item.active {
            background: rgba(255, 215, 0, 0.15);
            color: #ffd966;
            border-color: rgba(255, 215, 0, 0.5);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .menu-item:active {
            transform: scale(0.9);
        }

        .content-panel {
            flex: 1;
            background: rgba(10, 15, 26, 0.4);
            backdrop-filter: blur(10px);
            border-radius: 35px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 2px solid rgba(255, 215, 0, 0.2);
            padding: 15px;
        }

        .resources-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .resource-block {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 18px;
            padding: 12px 8px;
            text-align: center;
            border: 2px solid rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(5px);
        }

        .resource-icon {
            font-size: 22px;
            margin-bottom: 4px;
        }

        .resource-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .resource-amount {
            color: white;
            font-size: 16px;
            font-weight: 800;
        }

        .resource-amount.gold {
            color: #ffd966;
        }

        .timer-card {
            background: rgba(255, 215, 0, 0.1);
            border-radius: 25px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(5px);
        }

        .timer-label {
            color: #ffd966;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer-display {
            color: white;
            font-size: 28px;
            font-weight: 800;
            text-shadow: 0 0 15px #ffaa00;
        }

        .section-title {
            font-size: 24px;
            font-weight: 800;
            color: white;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .section-title span {
            background: #ffd966;
            color: #0a0f1e;
            width: 45px;
            height: 45px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transform: rotate(-5deg);
        }

        .cards-scroll {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }

        .cards-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .cards-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .cards-scroll::-webkit-scrollbar-thumb {
            background: #ffd966;
            border-radius: 10px;
        }

        .modern-card {
            background: rgba(20, 28, 45, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 12px;
            border: 2px solid rgba(255, 215, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card-row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-icon-large {
            width: 60px;
            height: 60px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            margin-right: 15px;
        }

        .card-info {
            flex: 1;
        }

        .card-name {
            color: white;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .card-desc {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .card-desc span {
            color: #ffd966;
            font-weight: 700;
        }

        .card-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .stat-pill {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 12px;
            text-align: center;
            border: 2px solid rgba(255, 215, 0, 0.2);
        }

        .stat-pill-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .stat-pill-value {
            color: #4caf50;
            font-size: 22px;
            font-weight: 800;
        }

        .stat-pill-value.gold {
            color: #ffd966;
        }

        .progress-modern {
            background: rgba(0, 0, 0, 0.3);
            height: 8px;
            border-radius: 20px;
            margin: 15px 0;
            overflow: hidden;
            border: 2px solid rgba(255, 215, 0, 0.2);
        }

        .progress-modern-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd966, #ffaa33);
            border-radius: 20px;
            width: 0%;
            box-shadow: 0 0 15px #ffaa00;
        }

        .button-modern {
            background: linear-gradient(145deg, #ffd966, #ffaa33);
            border: none;
            color: #0a0f1e;
            padding: 16px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 0 #8b5e3c;
            transition: 0.1s;
        }

        .button-modern:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #8b5e3c;
        }

        .button-modern:disabled {
            opacity: 0.3;
            transform: translateY(0);
            box-shadow: 0 5px 0 #8b5e3c;
            pointer-events: none;
        }

        .button-small {
            padding: 10px;
            font-size: 14px;
            background: rgba(255, 215, 0, 0.1);
            color: white;
            box-shadow: none;
            border: 2px solid rgba(255, 215, 0, 0.3);
        }

        .button-group {
            display: flex;
            gap: 5px;
            margin-top: 10px;
        }

        .price-up { color: #4caf50; }
        .price-down { color: #f44336; }

        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(255, 215, 0, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid #ffd966;
            color: white;
            padding: 15px 30px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.3s;
            z-index: 9999;
            white-space: nowrap;
        }

        .notification.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="top-panel">
            <div class="player-info">
                <div class="player-avatar">👑</div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-label">УР</span>
                        <span class="stat-value" id="levelValue">1</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">БАЛ</span>
                        <span class="stat-value gold" id="balance">$1K</span>
                    </div>
                </div>
            </div>
            <div class="header-buttons">
                <div class="header-btn" onclick="forceSave()">💾</div>
                <div class="header-btn" onclick="resetProgress()">🔄</div>
            </div>
        </div>

        <div class="main-container">
            <div class="left-menu">
                <div class="menu-item active" data-section="businesses">
                    <i>🏢</i>
                    <span>Биз</span>
                </div>
                <div class="menu-item" data-section="stocks">
                    <i>📈</i>
                    <span>Акц</span>
                </div>
                <div class="menu-item" data-section="realestate">
                    <i>🏘️</i>
                    <span>Нед</span>
                </div>
                <div class="menu-item" data-section="managers">
                    <i>👥</i>
                    <span>Мен</span>
                </div>
            </div>

            <div class="content-panel">
                <div class="resources-grid">
                    <div class="resource-block">
                        <div class="resource-icon">💰</div>
                        <div class="resource-label">БАЛ</div>
                        <div class="resource-amount gold" id="balanceDisplay">$1K</div>
                    </div>
                    <div class="resource-block">
                        <div class="resource-icon">💎</div>
                        <div class="resource-label">АЛМ</div>
                        <div class="resource-amount" id="crystals">0</div>
                    </div>
                    <div class="resource-block">
                        <div class="resource-icon">⏱️</div>
                        <div class="resource-label">ВРЕМЯ</div>
                        <div class="resource-amount" id="playTime">0м</div>
                    </div>
                    <div class="resource-block">
                        <div class="resource-icon">📊</div>
                        <div class="resource-label">ДОХ/10С</div>
                        <div class="resource-amount" id="incomePerPeriod">$0</div>
                    </div>
                </div>

                <div class="timer-card">
                    <span class="timer-label">⏱️ ДОХОД ЧЕРЕЗ</span>
                    <span class="timer-display" id="timer">10</span>
                </div>

                <div class="section-title" id="sectionTitle">
                    <span>🏢</span> БИЗНЕСЫ
                </div>

                <div class="cards-scroll" id="businesses-grid"></div>
                <div class="cards-scroll" id="stocks-grid" style="display: none;"></div>
                <div class="cards-scroll" id="realestate-grid" style="display: none;"></div>
                <div class="cards-scroll" id="managers-grid" style="display: none;"></div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
        let balance = 1000;
        let crystals = 0;
        let totalPlayTime = 0;
        let lastTimeUpdate = Date.now();
        let level = 1;
        let exp = 0;
        let expToNextLevel = 1000;
        let incomePerPeriod = 0;
        let currentSection = 'businesses';
        let lastIncomeTime = Date.now();

        // ========== БИЗНЕСЫ (УВЕЛИЧЕННЫЙ ДОХОД В 3 РАЗА) ==========
        let businesses = [
            { id: 0, name: 'Ларёк', icon: '🏪', income: 33.33, level: 1, cost: 500 }, // 11.11*3 = 33.33
            { id: 1, name: 'Фастфуд', icon: '🍔', income: 166.67, level: 0, cost: 50000 }, // 55.56*3 = 166.67
            { id: 2, name: 'Супермаркет', icon: '🏬', income: 833.33, level: 0, cost: 500000 }, // 277.78*3 = 833.33
            { id: 3, name: 'Банк', icon: '🏦', income: 4166.67, level: 0, cost: 5000000 }, // 1388.89*3 = 4166.67
            { id: 4, name: 'Завод', icon: '🏭', income: 20833.33, level: 0, cost: 50000000 }, // 6944.44*3 = 20833.33
            { id: 5, name: 'Отель', icon: '🏨', income: 104166.67, level: 0, cost: 500000000 }, // 34722.22*3 = 104166.67
            { id: 6, name: 'Авиакомпания', icon: '✈️', income: 520833.33, level: 0, cost: 5000000000 }, // 173611.11*3 = 520833.33
            { id: 7, name: 'Космотуризм', icon: '🚀', income: 2604166.67, level: 0, cost: 50000000000 }, // 868055.56*3 = 2604166.67
            { id: 8, name: 'Мегакорпорация', icon: '🌍', income: 13020833.33, level: 0, cost: 500000000000 }, // 4340277.78*3 = 13020833.33
            { id: 9, name: 'Галактическая', icon: '👑', income: 65104166.67, level: 0, cost: 5000000000000 } // 21701388.89*3 = 65104166.67
        ];

        // ========== АКЦИИ ==========
        let stocks = [
            { id: 0, name: 'Apple', icon: '🍎', price: 180, oldPrice: 180, shares: 0, dividend: 0.001111, maxShares: 1000000 },
            { id: 1, name: 'Microsoft', icon: '💻', price: 380, oldPrice: 380, shares: 0, dividend: 0.001111, maxShares: 1000000 },
            { id: 2, name: 'Google', icon: '🔍', price: 140, oldPrice: 140, shares: 0, dividend: 0.001111, maxShares: 1000000 },
            { id: 3, name: 'Amazon', icon: '📦', price: 130, oldPrice: 130, shares: 0, dividend: 0.001111, maxShares: 1000000 },
            { id: 4, name: 'Tesla', icon: '🚗', price: 250, oldPrice: 250, shares: 0, dividend: 0.001111, maxShares: 1000000 },
            { id: 5, name: 'NVIDIA', icon: '🎮', price: 800, oldPrice: 800, shares: 0, dividend: 0.001111, maxShares: 1000000 },
            { id: 6, name: 'Netflix', icon: '📺', price: 450, oldPrice: 450, shares: 0, dividend: 0.001111, maxShares: 1000000 },
            { id: 7, name: 'Disney', icon: '🐭', price: 110, oldPrice: 110, shares: 0, dividend: 0.001111, maxShares: 1000000 },
            { id: 8, name: 'Coca-Cola', icon: '🥤', price: 60, oldPrice: 60, shares: 0, dividend: 0.001111, maxShares: 1000000 },
            { id: 9, name: 'McDonalds', icon: '🍔', price: 280, oldPrice: 280, shares: 0, dividend: 0.001111, maxShares: 1000000 }
        ];

        // ========== НЕДВИЖИМОСТЬ (УВЕЛИЧЕННЫЙ ДОХОД В 3 РАЗА) ==========
        let properties = [
            { id: 0, name: 'Гараж', icon: '🏠', income: 16.67, level: 1, cost: 2000, maxLevel: 10 }, // 5.56*3 = 16.67
            { id: 1, name: 'Квартира', icon: '🏘️', income: 83.33, level: 1, cost: 10000, maxLevel: 10 }, // 27.78*3 = 83.33
            { id: 2, name: 'Дом', icon: '🏡', income: 416.67, level: 0, cost: 50000, maxLevel: 10 }, // 138.89*3 = 416.67
            { id: 3, name: 'Офис', icon: '🏬', income: 2083.33, level: 0, cost: 250000, maxLevel: 10 }, // 694.44*3 = 2083.33
            { id: 4, name: 'Отель', icon: '🏨', income: 10416.67, level: 0, cost: 1250000, maxLevel: 10 }, // 3472.22*3 = 10416.67
            { id: 5, name: 'Завод', icon: '🏭', income: 52083.33, level: 0, cost: 6250000, maxLevel: 10 }, // 17361.11*3 = 52083.33
            { id: 6, name: 'ТЦ', icon: '🏛️', income: 260416.67, level: 0, cost: 31250000, maxLevel: 10 }, // 86805.56*3 = 260416.67
            { id: 7, name: 'Замок', icon: '🏰', income: 1302083.33, level: 0, cost: 156250000, maxLevel: 10 }, // 434027.78*3 = 1302083.33
            { id: 8, name: 'Остров', icon: '🏝️', income: 6510416.67, level: 0, cost: 781250000, maxLevel: 10 }, // 2170138.89*3 = 6510416.67
            { id: 9, name: 'Космодром', icon: '🌌', income: 32552083.33, level: 0, cost: 3906250000, maxLevel: 10 } // 10850694.44*3 = 32552083.33
        ];

        // ========== МЕНЕДЖЕРЫ ==========
        let managers = [
            { id: 0, name: 'Менеджер продаж', bonus: 10, level: 0, cost: 20, icon: '👔' },
            { id: 1, name: 'Финансовый директор', bonus: 10, level: 0, cost: 20, icon: '💼' },
            { id: 2, name: 'Операционный менеджер', bonus: 10, level: 0, cost: 20, icon: '📊' },
            { id: 3, name: 'Маркетолог', bonus: 10, level: 0, cost: 20, icon: '📈' },
            { id: 4, name: 'IT-директор', bonus: 10, level: 0, cost: 20, icon: '💻' },
            { id: 5, name: 'HR-менеджер', bonus: 10, level: 0, cost: 20, icon: '👥' },
            { id: 6, name: 'Логист', bonus: 10, level: 0, cost: 20, icon: '🚚' },
            { id: 7, name: 'Юрист', bonus: 10, level: 0, cost: 20, icon: '⚖️' },
            { id: 8, name: 'CEO', bonus: 10, level: 0, cost: 20, icon: '👑' },
            { id: 9, name: 'Председатель', bonus: 10, level: 0, cost: 20, icon: '🏛️' }
        ];

        // ========== ФУНКЦИИ СОХРАНЕНИЯ ==========
        function saveAllData() {
            try {
                const saveData = {
                    balance, crystals, totalPlayTime, level, exp, expToNextLevel, lastIncomeTime, lastTimeUpdate,
                    businesses, stocks, properties, managers
                };
                localStorage.setItem('empireSave', JSON.stringify(saveData));
            } catch (e) {}
        }

        function loadAllData() {
            try {
                const saved = localStorage.getItem('empireSave');
                if (saved) {
                    const data = JSON.parse(saved);
                    balance = data.balance || 1000;
                    crystals = data.crystals || 0;
                    totalPlayTime = data.totalPlayTime || 0;
                    level = data.level || 1;
                    exp = data.exp || 0;
                    expToNextLevel = data.expToNextLevel || 1000;
                    lastIncomeTime = data.lastIncomeTime || Date.now();
                    lastTimeUpdate = data.lastTimeUpdate || Date.now();
                    if (data.businesses) businesses = data.businesses;
                    if (data.stocks) {
                        stocks = data.stocks;
                        stocks.forEach(s => s.oldPrice = s.price);
                    }
                    if (data.properties) properties = data.properties;
                    if (data.managers) managers = data.managers;
                }
            } catch (e) {}
        }

        // ========== ОБНОВЛЕНИЕ ВРЕМЕНИ И АЛМАЗОВ ==========
        function updatePlayTime() {
            const now = Date.now();
            const timePassed = (now - lastTimeUpdate) / 1000;
            
            if (timePassed >= 60) {
                const minutesPassed = Math.floor(timePassed / 60);
                totalPlayTime += minutesPassed * 60;
                crystals += minutesPassed;
                lastTimeUpdate = now;
            }
            
            updateUITime();
        }

        function updateUITime() {
            const minutes = Math.floor(totalPlayTime / 60);
            document.getElementById('playTime').textContent = `${minutes}м`;
        }

        // ========== РАСЧЁТ ДОХОДА ЗА 10 СЕКУНД ==========
        function calculatePeriodIncome() {
            let income = 0;
            
            businesses.forEach(b => {
                if (b.level > 0) {
                    income += b.income * b.level;
                }
            });
            
            properties.forEach(p => {
                if (p.level > 0) {
                    income += p.income * p.level;
                }
            });
            
            stocks.forEach(s => {
                if (s.shares > 0) {
                    income += s.shares * s.price * s.dividend;
                }
            });
            
            let managerBonus = 1.0;
            managers.forEach(m => {
                if (m.level > 0) {
                    managerBonus += m.level * 0.1;
                }
            });
            
            return Math.round(income * managerBonus * 100) / 100;
        }

        function calculateOfflineIncome() {
            const now = Date.now();
            const timePassed = (now - lastIncomeTime) / 1000;
            
            if (timePassed > 5) {
                const periodsPassed = Math.floor(timePassed / 10);
                if (periodsPassed > 0) {
                    let total = 0;
                    for (let i = 0; i < periodsPassed; i++) {
                        total += calculatePeriodIncome();
                    }
                    const offlineTotal = Math.round(total / 3 * 100) / 100;
                    balance += offlineTotal;
                    lastIncomeTime = now - (timePassed % 10) * 1000;
                }
            }
        }

        function collectIncome() {
            const income = calculatePeriodIncome();
            balance += income;
            exp += income;
            
            while (exp >= expToNextLevel) {
                level++;
                exp -= expToNextLevel;
                expToNextLevel = Math.floor(expToNextLevel * 1.5);
            }
            
            lastIncomeTime = Date.now();
            updateUI();
            renderCurrentSection();
        }

        // ========== ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ==========
        function updateTimer() {
            const now = Date.now();
            const timeLeft = Math.max(0, 10 - (now - lastIncomeTime) / 1000);
            const seconds = Math.floor(timeLeft);
            const ms = Math.floor((timeLeft - seconds) * 100);
            
            document.getElementById('timer').textContent = `${seconds}.${ms.toString().padStart(2,'0')}`;
            
            incomePerPeriod = calculatePeriodIncome();
            document.getElementById('incomePerPeriod').textContent = '$' + formatNumber(incomePerPeriod);
        }

        function updateUI() {
            document.getElementById('balanceDisplay').textContent = '$' + formatNumber(balance);
            document.getElementById('balance').textContent = '$' + formatNumber(balance);
            document.getElementById('crystals').textContent = formatNumber(crystals);
            document.getElementById('levelValue').textContent = level;
        }

        function renderCurrentSection() {
            if (currentSection === 'businesses') renderBusinesses();
            else if (currentSection === 'stocks') renderStocks();
            else if (currentSection === 'realestate') renderRealEstate();
            else if (currentSection === 'managers') renderManagers();
        }

        // ========== ПОКУПКИ ==========
        function buyBusiness(id) {
            const b = businesses[id];
            if (!b) return;
            const cost = b.cost * (b.level + 1);
            if (balance >= cost) {
                balance -= cost;
                b.level++;
                updateUI();
                renderBusinesses();
            }
        }

        function buyStock(id, amount) {
            const s = stocks[id];
            if (!s) return;
            if (s.shares + amount > s.maxShares) return;
            const cost = s.price * amount;
            if (balance >= cost && amount > 0) {
                balance -= cost;
                s.shares += amount;
                updateUI();
                renderStocks();
            }
        }

        function sellStock(id, amount) {
            const s = stocks[id];
            if (!s) return;
            if (s.shares >= amount && amount > 0) {
                balance += s.price * amount;
                s.shares -= amount;
                updateUI();
                renderStocks();
            }
        }

        function buyProperty(id) {
            const p = properties[id];
            if (!p) return;
            const cost = p.cost * (p.level + 1);
            if (balance >= cost && p.level < p.maxLevel) {
                balance -= cost;
                p.level++;
                updateUI();
                renderRealEstate();
            }
        }

        function buyManager(id) {
            const m = managers[id];
            if (!m) return;
            const cost = m.cost * (m.level + 1);
            if (crystals >= cost && m.level < 10) {
                crystals -= cost;
                m.level++;
                updateUI();
                renderManagers();
            }
        }

        // ========== РЕНДЕРИНГ ==========
        function renderBusinesses() {
            const container = document.getElementById('businesses-grid');
            container.innerHTML = '';
            businesses.forEach(b => {
                const profit = b.income * (b.level || 1);
                const cost = b.cost * (b.level + 1);
                container.innerHTML += `
                    <div class="modern-card">
                        <div class="card-row">
                            <div class="card-icon-large">${b.icon}</div>
                            <div class="card-info">
                                <div class="card-name">${b.name}</div>
                                <div class="card-desc">Уровень <span>${b.level}</span></div>
                            </div>
                        </div>
                        <div class="card-stats-grid">
                            <div class="stat-pill">
                                <div class="stat-pill-label">ДОХОД/10СЕК</div>
                                <div class="stat-pill-value">$${formatNumber(profit)}</div>
                            </div>
                            <div class="stat-pill">
                                <div class="stat-pill-label">ЦЕНА</div>
                                <div class="stat-pill-value gold">$${formatNumber(cost)}</div>
                            </div>
                        </div>
                        <div class="progress-modern">
                            <div class="progress-modern-fill" style="width:${b.level*10}%"></div>
                        </div>
                        <button class="button-modern" onclick="buyBusiness(${b.id})" ${balance<cost?'disabled':''}>
                            ${b.level===0?'КУПИТЬ':'УЛУЧШИТЬ'}
                        </button>
                    </div>
                `;
            });
        }

        function renderStocks() {
            const container = document.getElementById('stocks-grid');
            container.innerHTML = '';
            stocks.forEach(s => {
                const change = ((s.price - s.oldPrice) / (s.oldPrice || 1) * 100).toFixed(1);
                const changeClass = change >= 0 ? 'price-up' : 'price-down';
                const changeSign = change >= 0 ? '+' : '';
                const maxBuy = Math.min(Math.floor(balance / s.price), s.maxShares - s.shares);
                const dividendIncome = s.shares * s.price * s.dividend;
                const percentPerPeriod = (s.dividend * 100).toFixed(2);
                
                container.innerHTML += `
                    <div class="modern-card">
                        <div class="card-row">
                            <div class="card-icon-large">${s.icon}</div>
                            <div class="card-info">
                                <div class="card-name">${s.name}</div>
                                <div class="card-desc">${s.shares}/${formatNumber(s.maxShares)} шт • ${percentPerPeriod}%/10сек</div>
                            </div>
                        </div>
                        <div class="card-stats-grid">
                            <div class="stat-pill">
                                <div class="stat-pill-label">ЦЕНА</div>
                                <div class="stat-pill-value">$${formatNumber(s.price)}</div>
                                <div class="${changeClass}">${changeSign}${change}%</div>
                            </div>
                            <div class="stat-pill">
                                <div class="stat-pill-label">ДОХОД/10СЕК</div>
                                <div class="stat-pill-value gold">$${formatNumber(dividendIncome)}</div>
                            </div>
                        </div>
                        <div class="button-group">
                            <button class="button-modern button-small" onclick="buyStock(${s.id}, 1)" ${balance<s.price||s.shares>=s.maxShares?'disabled':''}>1</button>
                            <button class="button-modern button-small" onclick="buyStock(${s.id}, 10)" ${balance<s.price*10||s.shares+10>s.maxShares?'disabled':''}>10</button>
                            <button class="button-modern button-small" onclick="buyStock(${s.id}, ${maxBuy})" ${balance<s.price||maxBuy<=0?'disabled':''}>MAX</button>
                        </div>
                        ${s.shares > 0 ? `
                            <div class="button-group" style="margin-top:5px;">
                                <button class="button-modern button-small" style="background:#7a4a2a;" onclick="sellStock(${s.id}, 1)">-1</button>
                                <button class="button-modern button-small" style="background:#7a4a2a;" onclick="sellStock(${s.id}, 10)">-10</button>
                                <button class="button-modern button-small" style="background:#7a4a2a;" onclick="sellStock(${s.id}, ${s.shares})">ВСЁ</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
        }

        function renderRealEstate() {
            const container = document.getElementById('realestate-grid');
            container.innerHTML = '';
            properties.forEach(p => {
                const profit = p.income * (p.level || 1);
                const cost = p.cost * (p.level + 1);
                container.innerHTML += `
                    <div class="modern-card">
                        <div class="card-row">
                            <div class="card-icon-large">${p.icon}</div>
                            <div class="card-info">
                                <div class="card-name">${p.name}</div>
                                <div class="card-desc">Уровень <span>${p.level}/${p.maxLevel}</span></div>
                            </div>
                        </div>
                        <div class="card-stats-grid">
                            <div class="stat-pill">
                                <div class="stat-pill-label">ДОХОД/10СЕК</div>
                                <div class="stat-pill-value">$${formatNumber(profit)}</div>
                            </div>
                            <div class="stat-pill">
                                <div class="stat-pill-label">ЦЕНА</div>
                                <div class="stat-pill-value gold">$${formatNumber(cost)}</div>
                            </div>
                        </div>
                        <div class="progress-modern">
                            <div class="progress-modern-fill" style="width:${(p.level/p.maxLevel)*100}%"></div>
                        </div>
                        ${p.level < p.maxLevel ? 
                            `<button class="button-modern" onclick="buyProperty(${p.id})" ${balance<cost?'disabled':''}>УЛУЧШИТЬ</button>` : 
                            `<button class="button-modern" disabled>MAX</button>`}
                    </div>
                `;
            });
        }

        function renderManagers() {
            const container = document.getElementById('managers-grid');
            container.innerHTML = '';
            managers.forEach(m => {
                const cost = m.cost * (m.level + 1);
                container.innerHTML += `
                    <div class="modern-card">
                        <div class="card-row">
                            <div class="card-icon-large">${m.icon}</div>
                            <div class="card-info">
                                <div class="card-name">${m.name}</div>
                                <div class="card-desc">Уровень <span>${m.level}/10</span> • +10% доход</div>
                            </div>
                        </div>
                        <div class="card-stats-grid">
                            <div class="stat-pill">
                                <div class="stat-pill-label">БОНУС</div>
                                <div class="stat-pill-value">+${m.level*10}%</div>
                            </div>
                            <div class="stat-pill">
                                <div class="stat-pill-label">ЦЕНА</div>
                                <div class="stat-pill-value gold">💎 ${formatNumber(cost)}</div>
                            </div>
                        </div>
                        <div class="progress-modern">
                            <div class="progress-modern-fill" style="width:${m.level*10}%"></div>
                        </div>
                        ${m.level < 10 ? 
                            `<button class="button-modern" onclick="buyManager(${m.id})" ${crystals<cost?'disabled':''}>НАЙТИ</button>` : 
                            `<button class="button-modern" disabled>MAX</button>`}
                    </div>
                `;
            });
        }

        // ========== СБРОС ПРОГРЕССА ==========
        function resetProgress() {
            if (confirm('Сбросить весь прогресс?')) {
                localStorage.removeItem('empireSave');
                location.reload();
            }
        }

        function forceSave() {
            saveAllData();
        }

        // ========== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ==========
        function formatNumber(num) {
            if (!num && num !== 0) return '0';
            if (num >= 1e12) return (num / 1e12).toFixed(1) + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
            if (Number.isInteger(num)) return num.toString();
            return num.toFixed(2);
        }

        function showNotification(msg) {
            const n = document.getElementById('notification');
            n.textContent = msg;
            n.classList.add('show');
            setTimeout(() => n.classList.remove('show'), 2000);
        }

        function updateStockPrices() {
            stocks.forEach(s => {
                s.oldPrice = s.price;
                s.price *= (1 + (Math.random() * 0.2 - 0.1));
                if (s.price < 1) s.price = 1;
            });
            if (currentSection === 'stocks') renderStocks();
        }

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        function init() {
            document.querySelectorAll('.menu-item').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
                    document.querySelectorAll('.cards-scroll').forEach(c => c.style.display = 'none');
                    this.classList.add('active');
                    currentSection = this.dataset.section;
                    
                    const titles = {
                        businesses: 'БИЗНЕСЫ',
                        stocks: 'АКЦИИ',
                        realestate: 'НЕДВИЖИМОСТЬ',
                        managers: 'МЕНЕДЖЕРЫ'
                    };
                    
                    document.getElementById('sectionTitle').innerHTML = `<span>${this.querySelector('i').textContent}</span> ${titles[currentSection]}`;
                    document.getElementById(`${currentSection}-grid`).style.display = 'block';
                    
                    renderCurrentSection();
                });
            });

            loadAllData();
            calculateOfflineIncome();
            renderBusinesses();
            renderStocks();
            renderRealEstate();
            renderManagers();
            updateUI();
            updateUITime();

            setInterval(updateTimer, 50);
            setInterval(collectIncome, 10000);
            setInterval(updatePlayTime, 1000);
            setInterval(updateStockPrices, 60000);
            setInterval(saveAllData, 1000); // Автосохранение каждую секунду
        }

        window.forceSave = forceSave;
        window.resetProgress = resetProgress;
        window.buyBusiness = buyBusiness;
        window.buyStock = buyStock;
        window.sellStock = sellStock;
        window.buyProperty = buyProperty;
        window.buyManager = buyManager;

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
